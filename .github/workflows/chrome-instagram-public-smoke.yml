name: Sellora Google Chrome Public Smoke

on:
  push:
    branches:
      - fix/2026-10-20-instagram-oauth-status-mobile
  pull_request:
    branches:
      - codex/2026-10-20-instagram-raspberry-cutover
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm branded Google Chrome
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version

      - name: Check public response codes
        run: |
          set -euo pipefail
          for base in https://sellora-web-staging.vercel.app; do
            for route in /login /settings/integrations/instagram/callback?status=webhook_inactive; do
              code=$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "${base}${route}")
              echo "${base}${route} => ${code}"
              test "${code}" = 200
            done
          done

      - name: Render public and preview mobile login in Google Chrome
        run: |
          set -euo pipefail
          npm install --prefix /tmp/sellora-chrome --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.0
          NODE_PATH=/tmp/sellora-chrome/node_modules node <<'JS'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');
          const sites = [
            ['staging', 'https://sellora-web-staging.vercel.app/login'],
            ['preview', 'https://sellora-web-staging-git-fix-2026-10-2-b1cada-engine9rs-projects.vercel.app/login'],
          ];
          (async () => {
            const browser = await chromium.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              for (const [name, url] of sites) {
                const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForLoadState('networkidle', { timeout: 18000 }).catch(() => {});
                await page.waitForTimeout(1000);
                const body = (await page.locator('body').innerText()).trim();
                if (new URL(page.url()).hostname !== new URL(url).hostname) {
                  if (name === 'preview' && /vercel\.com$/.test(new URL(page.url()).hostname)) {
                    console.log('PREVIEW_BLOCKED_BY_VERCEL_SSO; browser rendering not verified');
                    await page.close();
                    continue;
                  }
                  throw Error('Unexpected cross-site redirect during Chrome smoke: ' + name);
                }
                const output = '/tmp/sellora-chrome/login-' + name + '-390.png';
                await page.screenshot({ path: output, fullPage: false });
                const bytes = fs.statSync(output).size;
                console.log(JSON.stringify({ browser: 'google-chrome', site: name, http: response?.status(),
                  viewport: '390x844', bodyChars: body.length, screenshotBytes: bytes,
                  jsPageErrors: errors.slice(0, 5) }));
                if (response?.status() !== 200 || !body.toLowerCase().includes('sellora') || bytes < 5000 || errors.length)
                  throw Error('Google Chrome mobile rendering failed for ' + name);
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exitCode = 1; });
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: sellora-google-chrome-public-mobile
          path: /tmp/sellora-chrome/login-*-390.png
          retention-days: 1
