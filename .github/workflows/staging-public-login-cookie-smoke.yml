name: Sellora Public Staging Chrome Login Gate
on:
  push:
    branches:
      - security/2026-10-20-staging-cookie-cutover
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Google Chrome driver
        run: |
          google-chrome --version
          npm install --prefix /tmp/sellora-public-smoke --no-save --no-audit --no-fund playwright-core@1.56.0
      - name: Verify real alias uses cookie refresh instead of legacy JWT bootstrap
        run: |
          NODE_PATH=/tmp/sellora-public-smoke/node_modules node <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          const base='https://sellora-web-staging.vercel.app';
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const requests=[],errors=[];
              page.on('request',req=>{if(req.url().includes('/api/v1/auth/'))requests.push(new URL(req.url()).pathname);});
              page.on('pageerror',err=>errors.push(err.message));
              const response=await page.goto(base+'/login',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(response.status(),200);
              assert.equal(response.headers()['x-frame-options'],'DENY');
              await page.waitForTimeout(2500);
              const path=new URL(page.url()).pathname;
              assert.equal(path,'/login','Guest was unexpectedly redirected');
              const cookieRefresh='/api/v1/auth/session/refresh';
              assert.ok(requests.includes(cookieRefresh),'Live staging login did not bootstrap from cookie endpoint');
              assert.ok(!requests.includes('/api/v1/auth/refresh'),'Legacy refresh was used');
              const form=await page.locator('input[type="email"]').count();
              assert.ok(form>0,'Login form is missing');
              const stored=await page.evaluate(()=>Object.keys(localStorage).filter(
                x=>/access_token|refresh_token/.test(x)));
              assert.deepEqual(stored,[]);
              const authErrors=errors.filter(x=>/auth|cookie|session|refresh|token/i.test(x));
              assert.deepEqual(authErrors,[]);
              console.log(JSON.stringify({result:'PUBLIC_STAGING_COOKIE_MODE_PASS',
                http:response.status(),path,cookieBootstrapCalls:requests.filter(x=>x===cookieRefresh).length,
                legacyRefreshCalls:0,storedJWT:0,authErrors:authErrors.length}));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
