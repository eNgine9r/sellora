name: Verify Sellora Raspberry

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify-oauth, verify-raspberry, verify-frontend-api, verify-browser, disable-render-autodeploy, retire-render]
        default: verify-oauth
        description: Raspberry verification or one-time retirement of Render autodeploy

permissions:
  contents: read

concurrency:
  group: sellora-raspberry-verification
  cancel-in-progress: false

jobs:
  verify-raspberry:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'verify-raspberry' || inputs.operation == 'verify-frontend-api')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify authenticated Raspberry API without customer mutations
        run: python3 deploy/raspberry/verify_target.py
        env:
          TARGET_API_URL: ${{ inputs.operation == 'verify-frontend-api' && 'https://sellora-web-staging.vercel.app/api/v1' || 'https://btc-radar.tail7f9b04.ts.net/api/v1' }}
          TARGET_EXPECTED_HOST: ${{ inputs.operation == 'verify-frontend-api' && 'sellora-web-staging.vercel.app' || 'btc-radar.tail7f9b04.ts.net' }}
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}

  verify-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser test runtime without deployment credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/sellora-canary-browser" --ignore-scripts --no-audit --no-fund playwright@1.52.0
          "$RUNNER_TEMP/sellora-canary-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public browser login to the Raspberry API
        run: node deploy/raspberry/verify_frontend.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sellora-canary-browser/node_modules/playwright
          FRONTEND_URL: https://sellora-web-staging.vercel.app
          TARGET_API_URL: https://sellora-web-staging.vercel.app/api/v1
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
  verify-oauth:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-oauth'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify generated Instagram handoff and public Raspberry callback
        run: python3 deploy/raspberry/verify_instagram_oauth.py
        env:
          STAGING_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}

  disable-render-autodeploy:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'disable-render-autodeploy' || inputs.operation == 'retire-render')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retire only the former Sellora Render service
        run: python3 deploy/raspberry/disable_render_autodeploy.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_RETIRE_SERVICE: ${{ inputs.operation == 'retire-render' && 'true' || 'false' }}
