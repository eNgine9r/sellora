name: Sellora Staging Global Cookie Cutover QA
on:
  push:
    branches:
      - security/2026-10-20-staging-cookie-cutover
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-host-cookie-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chrome
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix /tmp/sellora-cookie-chrome --no-save --no-audit --no-fund playwright-core@1.56.0
          google-chrome --version
      - name: Build with globally disabled flag and exact-host staging enabled
        env:
          NEXT_PUBLIC_COOKIE_SESSION_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_COOKIE_SESSION_STAGING_HOSTS: localhost
          SELLORA_API_UPSTREAM_URL: http://127.0.0.1:9999
        run: npm --prefix frontend run build
      - name: Real Next.js rewrite and secure cookie login in Chrome
        env:
          NEXT_PUBLIC_COOKIE_SESSION_AUTH_ENABLED: 'false'
          NEXT_PUBLIC_COOKIE_SESSION_STAGING_HOSTS: localhost
          SELLORA_API_UPSTREAM_URL: http://127.0.0.1:9999
        run: NODE_PATH=/tmp/sellora-cookie-chrome/node_modules node frontend/scripts/qa-cookie-proxy-smoke.cjs
