name: Sellora CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sellora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SECRET_KEY: ci-secret
  JWT_SECRET: ci-jwt-secret
  STAGING_NOVA_POSHTA_ALLOW_WRITES: "false"

jobs:
  backend-static:
    name: backend-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application, migrations and scripts
        run: python -m compileall app alembic scripts -q
      - name: Verify single Alembic head
        run: |
          heads="$(alembic heads --verbose | grep -c '^Rev:' || true)"
          [ "$heads" = "1" ] || {
            alembic heads --verbose
            echo "Expected exactly one Alembic head, found $heads"
            exit 1
          }
          alembic heads

  backend-focused:
    name: backend-focused
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run high-risk fulfillment and Nova Poshta suites
        run: |
          python -m pytest -q \
            tests/test_phone.py \
            tests/test_crm_completion.py \
            tests/test_instagram_customer_identity.py \
            tests/test_nova_poshta.py \
            tests/integrations/nova_poshta/test_external_inbox.py \
            tests/test_sprint_8f_foundation_migration.py \
            tests/test_order_fulfillment.py \
            tests/test_order_fulfillment_workflow.py \
            tests/test_order_fulfillment_api.py \
            tests/test_order_fulfillment_finance.py \
            tests/test_profit_calculation_service.py \
            tests/test_product_variant_inventory_archive.py \
            tests/inventory/test_inventory_operational_invariants.py \
            tests/test_order_fulfillment_consolidation_migration.py \
            tests/integrations/fulfillment/test_fulfillment_provider_reconciliation.py \
            tests/integrations/nova_poshta/test_real_provider_payload.py \
            tests/integrations/nova_poshta/test_durable_ttn_workflow.py \
            tests/ai/test_ai_foundation.py \
            tests/test_meta_instagram_foundation.py \
            tests/integrations/meta_instagram

  security-and-tenant-isolation:
    name: security-and-tenant-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run security, import provenance and operational invariants
        run: |
          python -m pytest -q \
            tests/security/test_endpoint_inventory.py \
            tests/security/test_tenant_object_isolation.py \
            tests/security/test_workspace_injection.py \
            tests/test_health_runtime_identity.py \
            tests/imports/test_import_execution_guard.py \
            tests/imports/test_import_source_storage.py \
            tests/imports/test_import_center_pilot_hardening.py \
            tests/imports/test_import_pilot_scope_safety.py \
            tests/imports/test_import_formula_rejection.py \
            tests/imports/test_import_inventory_plan.py \
            tests/imports/test_import_xlsx_content.py \
            tests/imports/test_import_historical_value_validation.py \
            tests/onboarding/test_onboarding_status.py \
            tests/onboarding/test_demo_workspace_service.py \
            tests/test_orders.py \
            tests/orders/test_order_lifecycle_pilot.py \
            tests/orders/test_sprint_8d_locking_contract.py \
            tests/inventory/test_inventory_operational_invariants.py \
            tests/test_shipments.py \
            tests/shipments/test_local_shipment_pilot.py \
            tests/test_meta_instagram_foundation.py \
            tests/integrations/meta_instagram

  backend-full:
    name: backend-full
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full backend suite
        run: python -m pytest tests -q

  postgresql-integration:
    name: postgresql-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sellora_test
          POSTGRES_USER: sellora
          POSTGRES_PASSWORD: sellora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellora -d sellora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sellora:sellora@localhost:5432/sellora_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Sprint 8F foundation migration gate
        run: python scripts/sprint_8f_migration_gate.py
      - name: Verify reversible Meta FX migration without dropping live sessions
        run: |
          # Revision 202610200038 intentionally prohibits destructive auth-session rollback.
          # Exercise only the newest, additive FX migration in disposable PostgreSQL.
          alembic upgrade head
          alembic downgrade 202610230044
          alembic upgrade head
          alembic current
      - name: Run PostgreSQL concurrency and consolidation tests
        run: |
          python -m pytest -q \
            tests/integrations/fulfillment/test_fulfillment_concurrency_postgres.py \
            tests/test_instagram_customer_identity.py \
            tests/test_order_fulfillment_consolidation_migration.py \
            tests/test_meta_instagram_foundation.py \
            tests/integrations/meta_instagram

      - name: Verify Direct identity locks on disposable PostgreSQL
        env:
          SELLORA_DISPOSABLE_DATABASE: "1"
        run: python -m pytest -q tests/test_instagram_customer_identity.py

      - name: Run isolated authenticated sale API canary
        env:
          SELLORA_SALE_DISPOSABLE_CANARY: "YES"
          SELLORA_COOKIE_SESSIONS_ENABLED: "true"
          META_INSTAGRAM_WEBHOOK_WORKER_ENABLED: "false"
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE sellora_sale_canary_isolated"))
          engine.dispose()
          PY
          export DATABASE_URL=postgresql+psycopg://sellora:sellora@localhost:5432/sellora_sale_canary_isolated
          alembic upgrade head
          PYTHONPATH=. python scripts/verify_sale_api_canary.py

      - name: Verify workspace subscriptions on disposable PostgreSQL
        env:
          SELLORA_SUBSCRIPTIONS_DISPOSABLE_CANARY: "YES"
        run: |
          python - <<'PYTHON'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.execute(text("CREATE DATABASE sellora_subscriptions_canary_isolated"))
          engine.dispose()
          PYTHON
          export DATABASE_URL=postgresql+psycopg://sellora:sellora@localhost:5432/sellora_subscriptions_canary_isolated
          alembic upgrade head
          python -m pytest -q tests/subscriptions

  direct-client-conflict-e2e:
    name: direct-client-conflict-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sellora_direct_client_conflict_e2e_isolated
          POSTGRES_USER: sellora
          POSTGRES_PASSWORD: sellora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellora -d sellora_direct_client_conflict_e2e_isolated"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sellora:sellora@127.0.0.1:5432/sellora_direct_client_conflict_e2e_isolated
      SELLORA_DIRECT_CONFLICT_E2E: "YES"
      SELLORA_DIRECT_CONFLICT_MANIFEST: ${{ runner.temp }}/direct-client-conflict.json
      PYTHONPATH: .
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
      META_INSTAGRAM_WEBHOOK_WORKER_ENABLED: "false"
      META_INSTAGRAM_WEBHOOK_PROCESSING_ENABLED: "false"
      META_INSTAGRAM_SEND_ENABLED: "false"
      META_INSTAGRAM_AUTO_ANALYSIS_ENABLED: "false"
      META_INSTAGRAM_AUTO_SEND_ENABLED: "false"
      META_SYNC_ENABLED: "false"
      AI_FEATURE_ENABLED: "false"
      AI_CUSTOMER_DATA_EXTRACTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install isolated Chromium runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed empty disposable Direct database
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/direct_client_conflict_e2e.py seed --manifest "$SELLORA_DIRECT_CONFLICT_MANIFEST"
      - name: Run real Direct identity browser API PostgreSQL coverage
        working-directory: frontend
        run: npm run test:e2e:direct-identity
      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: direct-client-conflict-browser-results
          path: frontend/.direct-client-conflict-results/
          retention-days: 7
      - name: Remove private synthetic credential manifest
        if: always()
        run: rm -f "$SELLORA_DIRECT_CONFLICT_MANIFEST"

  frontend-production:
    name: frontend-production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Vercel deployment budget policy
        run: node frontend/scripts/vercel-deployment-budget-regression.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify fulfillment amount and quantity behavior
        working-directory: frontend
        run: node scripts/fulfillment-amounts-test.mjs
      - name: Verify Direct product suggestion boundaries
        working-directory: frontend
        run: node scripts/direct-product-proposal-test.cjs
      - name: Verify Direct identity review
        working-directory: frontend
        run: node scripts/direct-identity-review-test.cjs
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Verify desktop Sellora brand alignment and mobile preservation
        run: node frontend/scripts/desktop-sidebar-brand-regression.mjs
      - name: Verify iOS mobile drawer background scroll lock
        run: node frontend/scripts/mobile-drawer-scroll-lock-regression.mjs
      - name: Verify grouped mobile and desktop sidebar navigation
        run: node frontend/scripts/grouped-sidebar-regression.mjs
      - name: Run mobile navigation and safe-area static regression
        working-directory: frontend
        run: npm run mobile:audit:static
      - name: Run customer and inventory report pagination regression
        run: node frontend/scripts/reports-customer-inventory-pagination-regression.mjs
      - name: Run workspace calendar, notes and insights regression
        run: node frontend/scripts/workspace-planner-regression.mjs
      - name: Run full CRM and report table consistency regression
        run: node frontend/scripts/sellora-all-tables-regression.mjs
      - name: Run desktop CRM table consistency regression
        run: node frontend/scripts/desktop-crm-table-consistency-regression.mjs
      - name: Run iPhone PWA crisp brand regression
        run: node frontend/scripts/ios-pwa-crisp-brand-regression.mjs
      - name: Run secure cookie-session frontend contract
        run: node frontend/scripts/cookie-session-runtime-contract.mjs
      - name: Run Direct mobile inbox and PWA header regression
        run: node frontend/scripts/direct-mobile-inbox-regression.mjs
      - name: Run compact Direct chat composer regression
        run: node frontend/scripts/direct-compact-composer-regression.mjs
      - name: Run historical NP order reconciliation regression
        run: node frontend/scripts/np-historical-order-reconciliation-regression.mjs
      - name: Run customer purchase profile regression
        run: node frontend/scripts/customer-purchase-profile-regression.mjs
      - name: Run import-center static regression
        run: node frontend/scripts/import-center-pilot-regression.mjs
      - name: Run orders, inventory and shipments static regression
        run: node frontend/scripts/orders-inventory-shipments-pilot-regression.mjs
      - name: Run Nova Poshta static regression
        run: node frontend/scripts/nova-poshta-real-validation-regression.mjs
      - name: Run Direct and Meta Instagram static regressions
        run: |
          node frontend/scripts/direct-app-shell-regression.mjs
          node frontend/scripts/meta-instagram-regression.mjs

  mobile-discovery:
    name: mobile-discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-poc/package-lock.json
      - name: Install Expo proof-of-concept dependencies
        working-directory: mobile-poc
        run: npm ci
      - name: Validate Expo proof-of-concept
        working-directory: mobile-poc
        run: npm run typecheck
